server.port=8080
spring.datasource.url=jdbc:h2:file:./data/clinic;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
clinic.jwt.secret=${CLINIC_JWT_SECRET:dev-only-change-this-secret-before-deployment-1234567890}
clinic.frontend-origin=${CLINIC_FRONTEND_ORIGIN:http://localhost:5173}
clinic.admin.email=${CLINIC_ADMIN_EMAIL:}
clinic.admin.password=${CLINIC_ADMIN_PASSWORD:}

